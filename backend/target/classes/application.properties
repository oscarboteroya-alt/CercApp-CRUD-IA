# Ruta: backend/src/main/resources/application.properties
# =====================================================================
# CercApp - Configuracion del backend Spring Boot
# Antes de arrancar: ejecute database/schema.sql en MySQL Workbench y
# ajuste el usuario / contrasena de MySQL en las lineas indicadas.
# =====================================================================

spring.application.name=cercapp-backend
server.port=8080

# --- Conexion a MySQL (la misma instancia que usa MySQL Workbench) ---
spring.datasource.url=jdbc:mysql://localhost:3306/cercapp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
# Cambie estas dos lineas por sus credenciales de MySQL
spring.datasource.username=root
spring.datasource.password=238972082
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "none": el esquema lo crea database/schema.sql (llaves foraneas, CHECK, ON DELETE CASCADE).
# Hibernate no modifica las tablas. Use "update" solo si quiere que Hibernate cree las tablas sin el script.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# --- JSON ---
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false
